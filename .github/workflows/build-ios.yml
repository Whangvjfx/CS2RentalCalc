name: Build iOS IPA (CS2RentalCalc)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          CURRENT_XCODE=$(xcodebuild -version | head -n 1)
          if [[ "$CURRENT_XCODE" == *"Xcode 15"* ]]; then
            echo "Xcode 15 detected, adjusting objectVersion to 56..."
            sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/' CS2RentalCalc.xcodeproj/project.pbxproj
          fi
          head -n 12 CS2RentalCalc.xcodeproj/project.pbxproj

      - name: Build iOS App (Unsigned for Sideloadly / AltStore / TrollStore)
        run: |
          xcodebuild -project CS2RentalCalc.xcodeproj \
            -scheme CS2RentalCalc \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Payload to IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/CS2RentalCalc.app
          python3 -c "import plistlib; p='Payload/CS2RentalCalc.app/Info.plist'; d=plistlib.load(open(p,'rb')); d['UILaunchStoryboardName']='LaunchScreen'; d['UILaunchScreen']={}; plistlib.dump(d,open(p,'wb')); print('Verified Info.plist launch screen keys:', d.get('UILaunchStoryboardName'), d.get('UILaunchScreen'))"
          zip -r CS2RentalCalc.ipa Payload
          ls -lh CS2RentalCalc.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS2RentalCalc-iOS-IPA
          path: CS2RentalCalc.ipa
          retention-days: 30

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CS2RentalCalc.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
