name: CS2RentalCalc
options:
  bundleIdPrefix: com.whangvjfx
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.9"

targets:
  CS2RentalCalc:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Core
      - path: Features
      - path: CS2RentalCalcApp.swift
      - path: LaunchScreen.storyboard
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_NAME: "CS2租伴"
        PRODUCT_BUNDLE_IDENTIFIER: com.whangvjfx.cs2rental
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST: "NO"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
